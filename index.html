<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:#151515;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.player{
  width:320px;
  padding:18px;
  margin:auto;
  background:#1f1f1f;
  border-radius:16px;
}
.song{
  font-size:16px;
  font-weight:700;
  line-height:1.45;
  min-height:52px;
}
button{
  width:100%;
  height:46px;
  margin-top:16px;
  border:none;
  border-radius:999px;
  background:white;
  color:black;
  font-weight:700;
  cursor:pointer;
}
input{
  width:100%;
  margin-top:14px;
}
.live{
  margin-top:10px;
  text-align:center;
  color:#888;
  font-size:11px;
}
</style>
</head>
<body>

<div class="player">
  <div id="song" class="song">読み込み中...</div>
  <button id="toggle">▶ PLAY</button>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
  <div class="live">LIVE</div>
</div>

<script>
const audio = new Audio('https://radio.gotanno.love/;');
audio.volume = 0.8;

const song = document.getElementById('song');
const btn = document.getElementById('toggle');
const vol = document.getElementById('volume');

btn.onclick = async ()=>{
  if(audio.paused){
    await audio.play();
  }else{
    audio.pause();
  }
};

audio.onplay = ()=> btn.textContent='⏸ STOP';
audio.onpause = ()=> btn.textContent='▶ PLAY';

vol.oninput = e => audio.volume = e.target.value;

async function updateSong(){
  try{
    const r = await fetch('https://radio.gotanno.love/stats.php?t='+Date.now());
    song.textContent = (await r.text()).trim();
  }catch{
    song.textContent = 'Offline';
  }
}

updateSong();
setInterval(updateSong,30000);
</script>

</body>
</html>
